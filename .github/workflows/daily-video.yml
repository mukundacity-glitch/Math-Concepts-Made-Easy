# Full autopilot — renders AND uploads to YouTube every day, no manual step.
#
# ONE-TIME SETUP (GitHub repo → Settings → Secrets and variables → Actions):
#
#   SECRETS (paste full file contents):
#     YT_CLIENT_SECRET_JSON   →  contents of secrets/client_secret.json
#     YT_TOKEN_JSON           →  contents of secrets/token.json
#
#   No variables needed — schedule runs automatically every day.
#   To temporarily pause posting, set variable  AUTOPILOT_PAUSED = true

name: Daily Lesson Video

on:
  schedule:
    # 19:00 UTC = 3 PM EDT (summer) / 2 PM EST (winter)
    # Gives ~2 h render time before the 5 PM homework-help window.
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Lesson day number (leave blank = next in sequence)"
        required: false
      privacy:
        description: "YouTube privacy"
        required: false
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private

jobs:
  produce-and-publish:
    # Always run — paused only when owner explicitly sets AUTOPILOT_PAUSED=true
    if: ${{ vars.AUTOPILOT_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies (Manim + LaTeX + ffmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev ffmpeg \
            texlive texlive-latex-extra texlive-fonts-recommended \
            texlive-extra-utils dvisvgm dvipng cm-super

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Resolved up front (rather than left to autopilot.py's own default)
      # so every later step — the artifact name, the upload, the recovery
      # workflow — all agree on exactly which day this run is for.
      - name: Determine lesson day
        id: day
        env:
          DAY_OVERRIDE: ${{ github.event.inputs.day }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          override = os.environ.get("DAY_OVERRIDE", "").strip()
          if override:
              day = int(override)
          else:
              state = json.load(open("state/progress.json"))
              day = int(state.get("next_day", 1))
          print(f"day={day}")
          EOF

      # Rendering is the expensive, must-not-fail-silently part. Kept as
      # its own step (no continue-on-error) so a render bug still fails
      # the job loudly, distinct from an upload/credentials problem below.
      - name: Produce Day ${{ steps.day.outputs.day }}
        run: python autopilot.py --day ${{ steps.day.outputs.day }}

      # Uploading depends on external YouTube OAuth credentials that can
      # expire or be revoked outside our control. continue-on-error keeps
      # a credentials hiccup from burying a perfectly good render under a
      # red "everything failed" job — the warning step below calls it out
      # explicitly instead, and the video is safely in the artifact either way.
      - name: Fail-closed media gate before upload
        run: |
          python - <<'EOF'
          import os
          from pipeline.media_gate import assert_publishable
          day = int(os.environ["LESSON_DAY"])
          assert_publishable(day)
          EOF
        env:
          LESSON_DAY: ${{ steps.day.outputs.day }}

      - name: Upload Day ${{ steps.day.outputs.day }} to YouTube
        id: upload
        continue-on-error: true
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_PRIVACY: ${{ github.event.inputs.privacy || vars.YT_PRIVACY || 'public' }}
        run: python -m uploader.youtube_upload --day ${{ steps.day.outputs.day }}

      - name: Mark day as uploaded in progress state
        if: steps.upload.outcome == 'success'
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          p = Path("state/progress.json")
          state = json.loads(p.read_text())
          day = ${{ steps.day.outputs.day }}
          if day not in state.setdefault("uploaded", []):
              state["uploaded"].append(day)
          p.write_text(json.dumps(state, indent=2) + "\n")
          EOF

      - name: Warn if upload failed
        if: steps.upload.outcome == 'failure'
        run: |
          echo "::warning::Day ${{ steps.day.outputs.day }} rendered successfully but the YouTube upload failed — see the 'Upload Day ${{ steps.day.outputs.day }} to YouTube' step above for the exact error."
          echo "::warning::The finished video + Shorts are attached to this run as the 'lesson-output-day${{ steps.day.outputs.day }}' artifact. Once credentials are fixed, run the 'Publish Lesson to YouTube' workflow for day ${{ steps.day.outputs.day }} to post it — no re-render needed."
          echo "::warning::If the error mentions 'invalid_grant' / 'Token has been expired or revoked', your Google OAuth consent screen is likely still in Testing status (refresh tokens auto-expire after 7 days there) — publish it to Production, then re-run \`python -m uploader.authorize\` and update the YT_TOKEN_JSON secret."

      - name: Save video as downloadable artifact (7-day backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-output-day${{ steps.day.outputs.day }}
          retention-days: 7
          path: |
            output/final_videos/*.mp4
            output/final_videos/*.srt
            output/final_videos/*.vtt
            output/thumbnails/*.jpg

      - name: Commit updated progress state
        if: always()
        run: |
          git config user.name "autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add state/progress.json
          git diff --cached --quiet || git commit -m "autopilot: advance lesson day"
          git push || true
