# Fully automatic daily production and YouTube publishing.
#
# Scheduled runs start at 06:00 America/New_York. Rendering happens first;
# YouTube receives the main video as a scheduled private upload and publishes it
# at 09:00 local time. The paired UTC schedules plus the gate below preserve
# those local times across daylight-saving changes.

name: Daily Lesson Video

on:
  schedule:
    - cron: "0 10 * * *" # 06:00 EDT
    - cron: "0 11 * * *" # 06:00 EST
  workflow_dispatch:
    inputs:
      day:
        description: "Lesson day number (blank = next in sequence)"
        required: false
      privacy:
        description: "YouTube privacy for a manual run"
        required: false
        default: "public"
        type: choice
        options: [public, unlisted, private]

concurrency:
  group: daily-lesson-production
  cancel-in-progress: false

jobs:
  schedule_gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Select the DST-correct schedule
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              print("should_run=true")
          else:
              offset = dt.datetime.now(ZoneInfo("America/New_York")).utcoffset()
              expected_utc_hour = 10 if offset == dt.timedelta(hours=-4) else 11
              scheduled_utc_hour = int(os.environ["EVENT_SCHEDULE"].split()[1])
              print(f"should_run={'true' if scheduled_utc_hour == expected_utc_hour else 'false'}")
          PY

  produce-and-publish:
    needs: schedule_gate
    if: ${{ needs.schedule_gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MCME_REQUIRE_NATIVE_SHORTS: "1"
      MCME_REQUIRE_CINEMATIC: "1"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: bash .github/scripts/install-render-deps.sh

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -q

      - name: Install and verify Remotion production renderer
        working-directory: remotion
        run: |
          npm install --no-audit --no-fund
          npm run check
          npx remotion browser ensure

      - name: Audit all remaining curriculum boards and narration cues
        run: python -m pipeline.cinematic_lesson --audit

      - name: Determine lesson day
        id: day
        env:
          DAY_OVERRIDE: ${{ github.event.inputs.day }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pipeline.progress import validate_next_publish_day

          override = os.environ.get("DAY_OVERRIDE", "").strip()
          state = json.load(open("state/progress.json", encoding="utf-8"))
          requested_day = int(override) if override else None
          try:
              day = validate_next_publish_day(state, requested_day)
          except ValueError as exc:
              raise SystemExit(f"Publishing guard rejected the run: {exc}") from exc
          print(f"day={day}")
          PY

      - name: Produce and verify Day ${{ steps.day.outputs.day }}
        run: python autopilot.py --day ${{ steps.day.outputs.day }} --no-advance --cinematic

      - name: Upload Day ${{ steps.day.outputs.day }} to YouTube
        id: upload
        continue-on-error: true
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_PRIVACY: ${{ github.event_name == 'schedule' && 'public' || github.event.inputs.privacy || vars.YT_PRIVACY || 'public' }}
          YT_MAIN_PUBLISH_LOCAL_TIME: "09:00"
          YT_START_TODAY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          MCME_PERSIST_UPLOAD_LEDGER: "1"
        run: python -m uploader.youtube_upload --day ${{ steps.day.outputs.day }}

      - name: Advance progress only after upload succeeds
        if: steps.upload.outcome == 'success'
        env:
          LESSON_DAY: ${{ steps.day.outputs.day }}
        run: |
          python - <<'PY'
          import os
          from pipeline.creative_history import record_lesson
          from pipeline.paths import load_cell1_config, read_state, write_state
          from pipeline.progress import mark_uploaded

          day = int(os.environ["LESSON_DAY"])
          state = read_state()
          mark_uploaded(state, day)
          write_state(state)
          plan = load_cell1_config().LESSON_PLAN
          record_lesson(day, plan["hook_variant"], plan["outro_variant"])
          PY

      - name: Warn without advancing when upload fails
        if: steps.upload.outcome == 'failure'
        run: |
          echo "::warning::Day ${{ steps.day.outputs.day }} passed rendering and QA, but YouTube upload failed. The day counter was not advanced, so the next scheduled run will retry this same lesson."

      - name: Retain per-asset upload receipts with the media package
        if: always()
        run: |
          if test -f state/upload_ledger.json; then
            mkdir -p output/logs
            cp state/upload_ledger.json output/logs/upload-ledger.json
          fi

      - name: Save output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-output-day${{ steps.day.outputs.day }}
          retention-days: 7
          path: |
            output/final_videos/*.mp4
            output/final_videos/*.srt
            output/final_videos/*.vtt
            output/final_videos/*native-shorts.json
            output/thumbnails/*.jpg
            output/logs/*coverage.json
            output/logs/upload-ledger.json
            output/hybrid/*.json
            output/cinematic/**/*.json
            output/final_videos/*cinematic-qa.json
            output/native-shorts/*.json

      - name: Commit successful progress
        if: steps.upload.outcome == 'success'
        run: |
          git config user.name "autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add state/progress.json state/creative_history.json
          git diff --cached --quiet || git commit -m "autopilot: publish day ${{ steps.day.outputs.day }}"
          git push

      - name: Fail job when upload failed
        if: steps.upload.outcome == 'failure'
        run: exit 1

