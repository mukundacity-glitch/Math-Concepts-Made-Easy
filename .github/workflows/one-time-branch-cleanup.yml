name: One-time merged branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Delete the merged working branches
        run: |
          git push origin --delete \
            codex/video-22-autopilot \
            codex/daily-ci-invocation \
            codex/remove-merged-branches

      - name: Remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-branch-cleanup.yml
          git commit -m "chore: finish merged-branch cleanup"
          git push origin HEAD:main
