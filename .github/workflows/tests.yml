name: Pipeline Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure FFmpeg with bounded package retries
        run: |
          if ! command -v ffmpeg >/dev/null; then
            timeout 120s sudo apt-get install -y --no-install-recommends ffmpeg || {
              timeout 90s sudo apt-get update -qq -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
              timeout 120s sudo apt-get install -y --no-install-recommends ffmpeg
            }
          fi
      - run: pip install pytest numpy 'sympy>=1.12'
      - run: python -m pytest -q
