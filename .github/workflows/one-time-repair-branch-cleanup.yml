name: One-time repair branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Delete the merged repair branch
        run: |
          git push origin --delete \
            codex/fix-scheduled-publishing-after-day22

      - name: Remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-repair-branch-cleanup.yml
          git commit -m "chore: finish repair branch cleanup"
          git push origin HEAD:main
